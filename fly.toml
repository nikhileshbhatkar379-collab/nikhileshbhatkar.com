# fly.toml - Fly.io deployment configuration for Nikhillesh Bhatkar Learning Academy
# Generated: 2024-11-05
# See https://fly.io/docs/reference/app-configuration/ for details.

app = "nikhileshbhatkaracademy"

primary_region = "sin"  # Singapore (closest to India; change as needed)

[build]
  # No build phase needed — we use pure Node.js
  # But if you want automatic builds from git:
  # builder = "paketobuildpacks/builder:full"

[env]
  PORT = "8080"  # Fly.io expects apps to listen on this port
  DATA_DIR = "/data"  # Persistent volume mount point

[[services]]
  http_checks = []
  internal_port = 8080
  processes = ["app"]
  protocol = "tcp"
  script_checks = []

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "10s"
    timeout = "2s"
    restart_limit = 0

[mounts]
  source = "academy_data"
  destination = "/data"